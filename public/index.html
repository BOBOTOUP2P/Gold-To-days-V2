<!DOCTYPE html><html lang="km"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bybit Gold Dashboard</title><style>@import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap');*{box-sizing:border-box;margin:0;padding:0;}body,html{height:100%;width:100%;background-color:#0b0e11;color:#ffffff;font-family:'Kantumruy Pro',sans-serif;overflow:hidden;}.container{display:flex;flex-direction:column;height:100vh;width:100vw;padding:10px;}.header{position:relative;flex:1.2;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(180deg,#1e2329 0%,#0b0e11 100%);border-radius:15px;margin-bottom:10px;border:1px solid #30363d;}.menu-btn{position:absolute;top:12px;right:14px;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:5px;outline:none;}.menu-btn svg{width:6vw;max-width:32px;min-width:22px;height:auto;stroke:#f3ba2f;}.title-text{font-size:8vw;color:#f3ba2f;font-weight:bold;text-transform:uppercase;}.date-text{font-size:3.5vw;color:#848e9c;margin-top:5px;}.row{flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 8%;margin-bottom:8px;background-color:#1e2329;border-radius:12px;border:1px solid #2b3139;}.label{font-size:8vw;font-weight:700;color:#eaecef;}.price-container{text-align:right;}.price{font-size:11vw;font-family:'Arial',sans-serif;font-weight:bold;color:#02c076;}.currency{font-size:3vw;color:#848e9c;margin-left:10px;}.price-up{color:#02c076 !important;}.price-down{color:#f84960 !important;}</style></head><body><div class="container"><div class="header"><button class="menu-btn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button><div class="title-text">តម្លៃមាសក្នុងថ្ងៃនេះ</div><div id="currentDate" class="date-text">កំពុងទាញទិន្នន័យ...</div></div><div class="row"><span class="label">1 អោន</span><div class="price-container"><span class="price" id="xaut-price">0.00</span><span class="currency">USD</span></div></div><div class="row"><span class="label">1 តម្លឹង</span><div class="price-container"><span class="price" id="damlung-price">0.00</span><span class="currency">USD</span></div></div><div class="row"><span class="label">1 ជី</span><div class="price-container"><span class="price" id="chi-price">0.00</span><span class="currency">USD</span></div></div><div class="row"><span class="label">1 ហ៊ុន</span><div class="price-container"><span class="price" id="hun-price">0.00</span><span class="currency">USD</span></div></div></div><script>let lastPrice=0;async function fetchGoldPrice(){try{const res=await fetch('/api/gold');const data=await res.json();if(data&&data.result&&data.result.list&&data.result.list.length>0){const price=parseFloat(data.result.list[0].lastPrice);updateDisplay(price);lastPrice=price;}}catch(e){console.error(e);}}function updateDisplay(price){const OUNCE_TO_DAMLUNG=1.20565;const pOunce=price;const pDamlung=price*OUNCE_TO_DAMLUNG;const pChi=pDamlung/10;const pHun=pChi/10;const elOunce=document.getElementById('xaut-price');if(lastPrice!==0&&price>lastPrice)elOunce.className="price price-up";else if(lastPrice!==0&&price<lastPrice)elOunce.className="price price-down";elOunce.innerText=pOunce.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});document.getElementById('damlung-price').innerText=pDamlung.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});document.getElementById('chi-price').innerText=pChi.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});document.getElementById('hun-price').innerText=pHun.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}function updateDate(){const now=new Date();const months=["មករា","កុម្ភៈ","មីនា","មេសា","ឧសភា","មិថុនា","កក្កដា","សីហា","កញ្ញា","តុលា","វិច្ឆិកា","ធ្នូ"];document.getElementById('currentDate').innerText=`ថ្ងៃទី ${now.getDate()} ខែ ${months[now.getMonth()]} ឆ្នាំ ${now.getFullYear()} | ${now.toLocaleTimeString()}`;}updateDate();fetchGoldPrice();setInterval(fetchGoldPrice,3000);setInterval(updateDate,1000);</script></body></html>
